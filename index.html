<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>White Noise</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: max(env(safe-area-inset-top), 24px) 20px max(env(safe-area-inset-bottom), 24px);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    font-size: 14px;
    font-weight: 500;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0 0 24px;
  }
  .now-playing {
    background: #161616;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .now-playing-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .label-sm {
    font-size: 12px;
    color: #888;
  }
  .status {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .status.playing { color: #4ade80; }
  .current-sound {
    font-size: 24px;
    font-weight: 500;
    margin-top: 4px;
  }
  .sound-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .sound-btn {
    background: #161616;
    color: #f5f5f5;
    border: 1px solid #262626;
    border-radius: 14px;
    padding: 18px 12px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    min-height: 60px;
    font-family: inherit;
  }
  .sound-btn:active { transform: scale(0.97); }
  .sound-btn.active {
    background: #f5f5f5;
    color: #0a0a0a;
    border-color: #f5f5f5;
  }
  .control-block { margin-bottom: 24px; }
  .control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .value {
    font-size: 13px;
    font-weight: 500;
    color: #f5f5f5;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 36px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    background: #262626;
    border-radius: 2px;
  }
  input[type="range"]::-moz-range-track {
    height: 4px;
    background: #262626;
    border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #f5f5f5;
    margin-top: -10px;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #f5f5f5;
    border: none;
    cursor: pointer;
  }
  .timer-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .timer-btn {
    background: #161616;
    color: #f5f5f5;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 12px 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    min-height: 44px;
    font-family: inherit;
  }
  .timer-btn:active { transform: scale(0.97); }
  .timer-btn.active {
    background: #f5f5f5;
    color: #0a0a0a;
    border-color: #f5f5f5;
  }
  .play-btn {
    width: 100%;
    padding: 22px;
    font-size: 17px;
    font-weight: 600;
    background: #f5f5f5;
    color: #0a0a0a;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    margin-top: auto;
    min-height: 64px;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s;
  }
  .play-btn:active { transform: scale(0.98); }
  .play-btn.playing {
    background: #2a1414;
    color: #f87171;
  }
  .footer {
    font-size: 11px;
    color: #555;
    text-align: center;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>White Noise</h1>

  <div class="now-playing">
    <div class="now-playing-row">
      <span class="label-sm">Now playing</span>
      <span id="status" class="status">Stopped</span>
    </div>
    <div id="current-sound" class="current-sound">White noise</div>
  </div>

  <div class="sound-grid">
    <button class="sound-btn active" data-sound="white">White</button>
    <button class="sound-btn" data-sound="pink">Pink</button>
    <button class="sound-btn" data-sound="brown">Brown</button>
    <button class="sound-btn" data-sound="rain">Rain</button>
    <button class="sound-btn" data-sound="ocean">Ocean</button>
    <button class="sound-btn" data-sound="fan">Fan</button>
  </div>

  <div class="control-block">
    <div class="control-header">
      <span class="label-sm">Volume</span>
      <span id="vol-out" class="value">50%</span>
    </div>
    <input type="range" id="volume" min="0" max="100" value="50" step="1">
  </div>

  <div class="control-block">
    <div class="control-header">
      <span class="label-sm">Sleep timer</span>
      <span id="timer-out" class="value">Off</span>
    </div>
    <div class="timer-grid">
      <button class="timer-btn active" data-mins="0">No timer</button>
      <button class="timer-btn" data-mins="15">15 min</button>
      <button class="timer-btn" data-mins="30">30 min</button>
      <button class="timer-btn" data-mins="60">60 min</button>
    </div>
  </div>

  <button id="play-btn" class="play-btn">Play</button>
  <p class="footer">Add to Home Screen for app-like access</p>
</div>

<script>
(function() {
  let audioCtx = null;
  let currentNode = null;
  let gainNode = null;
  let isPlaying = false;
  let currentSound = 'white';
  let volume = 0.5;
  let timerMins = 0;
  let timerHandle = null;
  let timerEnd = null;
  let timerInterval = null;

  const soundLabels = {
    white: 'White noise',
    pink: 'Pink noise',
    brown: 'Brown noise',
    rain: 'Rain',
    ocean: 'Ocean waves',
    fan: 'Fan'
  };

  function ensureCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function makeWhiteBuffer() {
    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function makePinkBuffer() {
    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      data[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    return buf;
  }

  function makeBrownBuffer() {
    const len = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      data[i] = last * 3.5;
    }
    return buf;
  }

  function startNoiseLoop(buffer, filterFn) {
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    let last = src;
    if (filterFn) last = filterFn(src);
    gainNode = audioCtx.createGain();
    gainNode.gain.value = volume;
    last.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    src.start();
    return src;
  }

  function startSound(name) {
    ensureCtx();
    stopSound(false);

    if (name === 'white') {
      currentNode = startNoiseLoop(makeWhiteBuffer());
    } else if (name === 'pink') {
      currentNode = startNoiseLoop(makePinkBuffer());
    } else if (name === 'brown') {
      currentNode = startNoiseLoop(makeBrownBuffer());
    } else if (name === 'rain') {
      currentNode = startNoiseLoop(makePinkBuffer(), function(src) {
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 800;
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 6000;
        src.connect(hp);
        hp.connect(lp);
        return lp;
      });
    } else if (name === 'ocean') {
      let lp;
      currentNode = startNoiseLoop(makeBrownBuffer(), function(src) {
        lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 600;
        src.connect(lp);
        return lp;
      });
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.value = 0.12;
      lfoGain.gain.value = 400;
      lfo.connect(lfoGain);
      lfoGain.connect(lp.frequency);
      lfo.start();
      currentNode._lfo = lfo;
    } else if (name === 'fan') {
      currentNode = startNoiseLoop(makeBrownBuffer(), function(src) {
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 1200;
        src.connect(lp);
        return lp;
      });
    }
    isPlaying = true;
    updateUI();
  }

  function stopSound(updateState) {
    if (currentNode) {
      try { currentNode.stop(); } catch(e) {}
      if (currentNode._lfo) {
        try { currentNode._lfo.stop(); } catch(e) {}
      }
      currentNode = null;
    }
    if (gainNode) {
      try { gainNode.disconnect(); } catch(e) {}
      gainNode = null;
    }
    if (updateState !== false) {
      isPlaying = false;
      clearTimer();
      updateUI();
    }
  }

  function updateUI() {
    const playBtn = document.getElementById('play-btn');
    const status = document.getElementById('status');
    const label = document.getElementById('current-sound');
    playBtn.textContent = isPlaying ? 'Stop' : 'Play';
    playBtn.classList.toggle('playing', isPlaying);
    status.textContent = isPlaying ? 'Playing' : 'Stopped';
    status.classList.toggle('playing', isPlaying);
    label.textContent = soundLabels[currentSound];
  }

  function clearTimer() {
    if (timerHandle) { clearTimeout(timerHandle); timerHandle = null; }
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    timerEnd = null;
    document.getElementById('timer-out').textContent = timerMins === 0 ? 'Off' : timerMins + ' min';
  }

  function startTimer() {
    clearTimer();
    if (timerMins === 0) return;
    timerEnd = Date.now() + timerMins * 60 * 1000;
    timerHandle = setTimeout(function() { stopSound(true); }, timerMins * 60 * 1000);
    timerInterval = setInterval(function() {
      const remaining = Math.max(0, timerEnd - Date.now());
      const m = Math.floor(remaining / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      document.getElementById('timer-out').textContent = m + ':' + (s < 10 ? '0' : '') + s;
    }, 1000);
  }

  document.querySelectorAll('.sound-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.sound-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentSound = btn.dataset.sound;
      if (isPlaying) startSound(currentSound);
      else updateUI();
    });
  });

  document.querySelectorAll('.timer-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.timer-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      timerMins = parseInt(btn.dataset.mins, 10);
      if (isPlaying && timerMins > 0) startTimer();
      else clearTimer();
    });
  });

  document.getElementById('volume').addEventListener('input', function(e) {
    volume = parseInt(e.target.value, 10) / 100;
    document.getElementById('vol-out').textContent = Math.round(volume * 100) + '%';
    if (gainNode) gainNode.gain.value = volume;
  });

  document.getElementById('play-btn').addEventListener('click', function() {
    if (isPlaying) {
      stopSound(true);
    } else {
      startSound(currentSound);
      if (timerMins > 0) startTimer();
    }
  });
})();
</script>
</body>
</html>
